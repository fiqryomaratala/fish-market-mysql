services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fish_market_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Fish Marketplace Backend}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      BASE_URL: ${BASE_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Di dalam network Docker, backend harus mengakses service MySQL via nama service, bukan localhost.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-fishuser}
      DB_PASSWORD: ${DB_PASSWORD:-fishpass}
      DB_NAME: ${DB_NAME:-fish_market_db}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret}
      JWT_EXPIRED: ${JWT_EXPIRED:-24h}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      XENDIT_API_KEY: ${XENDIT_API_KEY:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8080"

  mysql:
    image: mysql:8.0
    container_name: fish_market_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fish_market_db
      MYSQL_USER: fishuser
      MYSQL_PASSWORD: fishpass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: fish_market_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro

volumes:
  mysql_data:
  uploads_data:
