services:
  mysql:
    image: mysql:8.0
    container_name: fish_market_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fish_market_db
      MYSQL_USER: fishuser
      MYSQL_PASSWORD: fishpass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: