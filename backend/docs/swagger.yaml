basePath: /api
definitions:
  handlers.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.AddToCartRequest:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  handlers.CheckoutRequest:
    properties:
      shipping_address:
        type: string
    type: object
  handlers.CreateFishBatchRequest:
    properties:
      average_weight:
        type: number
      expected_harvest:
        type: string
      fish_type:
        type: string
      pond_id:
        type: integer
      seed_count:
        type: integer
      start_date:
        type: string
    type: object
  handlers.FeedingLogRequest:
    properties:
      feed_amount:
        type: number
      feed_time:
        type: string
      feed_type:
        type: string
      fish_batch_id:
        type: integer
      notes:
        type: string
    type: object
  handlers.HarvestRequest:
    properties:
      average_weight:
        type: number
      fish_batch_id:
        type: integer
      fish_count:
        type: integer
      harvest_date:
        type: string
      notes:
        type: string
      total_weight:
        type: number
    type: object
  handlers.InventoryAdjustmentRequest:
    properties:
      description:
        type: string
      inventory_id:
        type: integer
      quantity:
        type: number
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.PondRequest:
    properties:
      area:
        type: number
      capacity:
        type: integer
      description:
        type: string
      location:
        type: string
      name:
        type: string
      water_type:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.UpdateCartRequest:
    properties:
      quantity:
        type: integer
    type: object
  handlers.UpdateFishBatchRequest:
    properties:
      average_weight:
        type: number
      current_count:
        type: integer
      expected_harvest:
        type: string
      fish_type:
        type: string
      pond_id:
        type: integer
      seed_count:
        type: integer
      start_date:
        type: string
